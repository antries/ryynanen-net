<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aamutreeni">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF3D1">
<title>Aamutreeni</title>
<style>
:root{--bg:#FFF3D1;--sun:#FFC83D;--orange:#FF8A1F;--coral:#FF6B57;--ink:#14284B;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.flash{animation:fl .9s ease-out}
@keyframes fl{0%{background:var(--coral)}100%{background:var(--bg)}}
#app{min-height:100%;max-width:480px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
h1{font-size:40px;line-height:1.05;margin:0;font-weight:900;letter-spacing:-.5px}
h2{font-size:22px;margin:0;font-weight:800}
p{margin:0;font-size:18px;line-height:1.4}
.muted{opacity:.7}
.btn{display:block;width:100%;border:0;border-radius:28px;padding:20px;font:inherit;font-size:20px;font-weight:800;color:var(--ink);background:var(--orange);cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.sun{background:var(--sun)}
.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 3px var(--ink)}
.btn:disabled{opacity:.35}
.btn.sm{padding:14px;font-size:17px;border-radius:22px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.card{background:var(--card);border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:10px}
.pick{position:relative;text-align:left;border:0;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.pick.rec{background:var(--sun)}
.tag{position:absolute;top:16px;right:16px;background:var(--coral);border-radius:16px;padding:4px 12px;font-weight:800;font-size:15px}
.pick ul{margin:0;padding-left:20px;font-size:17px;line-height:1.5}
.top{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:14px;border-radius:7px;background:rgba(20,40,75,.15)}
.bar i.g{margin-right:8px}
.bar i.d{background:var(--orange)}
.bar i.c{background:var(--coral)}
.reps{font-size:24px;font-weight:800;color:var(--coral)}
.grow{flex:1}
.ringwrap{position:relative;width:min(72vw,300px);aspect-ratio:1;margin:8px auto}
.ringwrap svg{width:100%;height:100%}
.ringnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:84px;font-weight:900}
.ringnum small{font-size:18px;font-weight:700;opacity:.7}
.center{text-align:center}
.stat{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:10px 0;border-bottom:2px solid rgba(20,40,75,.1)}
.stat:last-child{border:0}
label.set{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:18px;font-weight:700}
input[type=number]{width:96px;font:inherit;font-size:20px;font-weight:700;padding:10px;border-radius:16px;border:3px solid var(--sun);background:#fff;color:var(--ink);text-align:center}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--orange)}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const EX={
A:[
{n:"Punnerrus",r:"10–15 toistoa",t:"Vartalo suorana, kädet hartioita hieman leveämmällä. Laske rinta lähelle lattiaa ja työnnä ylös.",w:0},
{n:"Pystypunnerrus",r:"10–12 toistoa",t:"Seiso tukevasti ja jännitä vatsa. Paina painot pään yläpuolelle, älä notkista alaselkää.",w:1},
{n:"Hauiskääntö",r:"10–12 toistoa",t:"Kyynärpäät kylkien vieressä. Nosta painot ylös ilman heilautusta ja laske hitaasti.",w:1},
{n:"Sivuvipunosto",r:"12–15 toistoa",t:"Kyynärpäät hieman koukussa. Nosta kädet sivuille hartiakorkeuteen, älä kohauta olkapäitä.",w:1}],
B:[
{n:"Lattiapunnerrus",r:"10–12 toistoa",t:"Makaa selällään, polvet koukussa, painot rinnan sivuilla. Paina painot ylös ja laske, kunnes olkavarret koskettavat kevyesti lattiaa.",w:1},
{n:"Hammer-käännö",r:"10–12 toistoa",t:"Pidä painoja peukalot ylöspäin. Kyynärpäät paikallaan, nosta painot kohti olkapäitä.",w:1},
{n:"Takaolkapään levitys",r:"12–15 toistoa",t:"Etukumarassa, selkä suorana, painot roikkuen. Vie kädet sivuille ja purista lapaluita yhteen.",w:1},
{n:"Ojentajapunnerrus",r:"8–12 toistoa",t:"Kädet lähellä toisiaan rinnan alla, kyynärpäät kylkiä vasten. Polvet maassa, jos liike on liian raskas.",w:0}]
};
const DAYS=["sunnuntai","maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai"];
const KEY="aamutreeni_v2_asetukset";
let cfg={move:45,round:60,sound:true,vib:true,kg:{}};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}
let S={phase:"home",type:"A",cur:0,start:0,end:0,total:0,dur:0,wl:null},T=null,AC=null;
const $=id=>document.getElementById(id);
const app=$("app");
const todayType=()=>[0,1,3,5].includes(new Date().getDay())?"A":"B";
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const kgText=(ty,i)=>{const v=cfg.kg[ty+i];return v?v+" kg / käsi":""};

function initAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(n){if(!cfg.sound||!AC)return;for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.22;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.start(t);o.stop(t+.18)}}
function alarm(n){beep(n||3);if(cfg.vib&&navigator.vibrate)navigator.vibrate([200,100,200]);document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash")}
async function wake(){try{if("wakeLock" in navigator&&!S.wl){S.wl=await navigator.wakeLock.request("screen");S.wl.addEventListener("release",()=>{S.wl=null})}}catch(e){}}
function unwake(){try{S.wl&&S.wl.release()}catch(e){}S.wl=null}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(S.phase==="work"||S.phase==="rest")){wake();if(S.phase==="rest")tick()}});

function start(ty){initAudio();S={...S,phase:"work",type:ty,cur:0,start:Date.now()};wake();render()}
function done(){
  if(S.cur===11){finish();return}
  S.total=(S.cur%4===3?cfg.round:cfg.move)*1000;S.end=Date.now()+S.total;S.phase="rest";render();stopTick();T=setInterval(tick,200)}
function stopTick(){clearInterval(T);T=null}
function tick(){
  if(S.phase!=="rest")return;
  const ms=S.end-Date.now();
  if(ms<=0){stopTick();S.cur++;S.phase="work";alarm(3);render();return}
  const n=$("num"),r=$("ring");
  if(n)n.firstChild.nodeValue=Math.ceil(ms/1000);
  if(r)r.style.strokeDashoffset=603*(1-ms/S.total)}
function plus(){S.end+=15000;S.total+=15000;tick()}
function skip(){stopTick();S.cur++;S.phase="work";render()}
function prev(){stopTick();if(S.phase==="work"&&S.cur>0)S.cur--;S.phase="work";render()}
function finish(){stopTick();S.dur=Date.now()-S.start;S.phase="done";unwake();alarm(2);render()}
function quit(){if(confirm("Keskeytetäänkö treeni?")){stopTick();unwake();S.phase="home";S.cur=0;render()}}
function reset(){S.phase="home";S.cur=0;render()}
function go(p){S.phase=p;render()}

function bar(n){return '<div class="bar" aria-hidden="true">'+Array.from({length:12},(_,i)=>'<i class="'+(i<n?"d":i===n?"c":"")+(i%4===3&&i<11?" g":"")+'"></i>').join("")+"</div>"}
function list(ty){return "<ul>"+EX[ty].map(e=>"<li>"+e.n+"</li>").join("")+"</ul>"}

function render(){
  const ph=S.phase;let h="";
  if(ph==="home"){
    const t=todayType(),o=t==="A"?"B":"A";
    const card=ty=>'<button class="card pick'+(ty===t?" rec":"")+'" onclick="start(\''+ty+'\')">'+(ty===t?'<span class="tag">Tänään</span>':"")+"<h2>Treeni "+ty+"</h2><p>"+(ty==="A"?"ma, ke, pe, su":"ti, to, la")+"</p>"+list(ty)+"</button>";
    h='<div><h1>Aamutreeni</h1></div><p>Tänään on '+DAYS[new Date().getDay()]+". Suositus: Treeni "+t+".</p>"+card(t)+card(o)+'<button class="btn sun" onclick="go(\'settings\')">Asetukset</button>';
  }
  else if(ph==="work"){
    const ex=EX[S.type][S.cur%4],kg=kgText(S.type,S.cur%4);
    h='<div class="top"><span>Treeni '+S.type+'</span><span>Kierros '+(Math.floor(S.cur/4)+1)+"/3 · Liike "+(S.cur%4+1)+"/4</span></div>"+bar(S.cur)+
    '<div class="card grow" style="justify-content:center"><div class="reps">'+ex.r+(kg?" · "+kg:"")+"</div><h1>"+ex.n+"</h1><p>"+ex.t+'</p></div><p class="center muted">Sarja '+(S.cur+1)+"/12</p>"+
    '<button class="btn" onclick="done()" style="padding:26px;font-size:24px">Sarja valmis</button><div class="row"><button class="btn sun sm" onclick="prev()"'+(S.cur===0?" disabled":"")+'>Edellinen</button><button class="btn ghost sm" onclick="quit()">Keskeytä</button></div>';
  }
  else if(ph==="rest"){
    const nx=EX[S.type][(S.cur+1)%4],nr=S.cur%4===3;
    h='<div class="top"><span>Treeni '+S.type+"</span><span>Sarja "+(S.cur+1)+"/12 valmis</span></div>"+bar(S.cur+1)+
    '<h2 class="center">Palautus</h2><div class="ringwrap"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" stroke="rgba(20,40,75,.12)" stroke-width="18"/><circle id="ring" cx="110" cy="110" r="96" fill="none" stroke="#FF8A1F" stroke-width="18" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="0" transform="rotate(-90 110 110)"/></svg><div class="ringnum" id="num">'+Math.ceil((S.end-Date.now())/1000)+"<small>sekuntia</small></div></div>"+
    '<p class="center">'+(nr?"Kierros "+(Math.floor(S.cur/4)+2)+" alkaa: ":"Seuraavaksi: ")+"<b>"+nx.n+"</b></p><div class=\"grow\"></div>"+
    '<div class="row"><button class="btn sun" onclick="plus()">+15 s</button><button class="btn" onclick="skip()">Ohita</button></div><button class="btn ghost sm" onclick="prev()">Edellinen</button>';
  }
  else if(ph==="done"){
    h='<div class="grow"></div><h1 class="center">Treeni valmis!</h1><div class="card"><div class="stat"><span>Treeni</span><span>Treeni '+S.type+'</span></div><div class="stat"><span>Kesto</span><span>'+fmt(S.dur)+'</span></div><div class="stat"><span>Sarjat</span><span>12/12 sarjaa</span></div></div><div class="grow"></div><button class="btn coral" onclick="reset()">Tyhjennä ja aloita uusi</button>';
  }
  else if(ph==="settings"){
    h='<h1>Asetukset</h1><div class="card"><h2>Palautus</h2><label class="set">Liikkeiden välillä (s)<input type="number" inputmode="numeric" min="5" max="300" value="'+cfg.move+'" oninput="cfg.move=Math.max(5,+this.value||45);save()"></label><label class="set">Kierrosten välillä (s)<input type="number" inputmode="numeric" min="5" max="300" value="'+cfg.round+'" oninput="cfg.round=Math.max(5,+this.value||60);save()"></label><label class="set">Merkkiääni<input type="checkbox" '+(cfg.sound?"checked":"")+' onchange="cfg.sound=this.checked;save()"></label><label class="set">Värinä (jos laite tukee)<input type="checkbox" '+(cfg.vib?"checked":"")+' onchange="cfg.vib=this.checked;save()"></label></div>';
    ["A","B"].forEach(ty=>{h+='<div class="card"><h2>Painot, Treeni '+ty+" (kg / käsi)</h2>"+EX[ty].map((e,i)=>e.w?'<label class="set">'+e.n+'<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="'+(cfg.kg[ty+i]||"")+'" oninput="cfg.kg[\''+ty+i+'\']=parseFloat(this.value)||0;save()"></label>':"").join("")+"</div>"});
    h+='<button class="btn" onclick="go(\'home\')">Valmis</button>';
  }
  app.innerHTML=h;window.scrollTo(0,0);
}

try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");x.fillStyle="#FFC83D";x.fillRect(0,0,180,180);x.fillStyle="#FF8A1F";x.beginPath();x.arc(90,90,48,0,7);x.fill();x.strokeStyle="#FF6B57";x.lineWidth=10;x.lineCap="round";for(let i=0;i<8;i++){const a=i*Math.PI/4;x.beginPath();x.moveTo(90+64*Math.cos(a),90+64*Math.sin(a));x.lineTo(90+78*Math.cos(a),90+78*Math.sin(a));x.stroke()}const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}
render();
</script>
</body>
</html>
