<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#125c36"><title>Birkkujahti</title><style>
:root{--g:#125c36;--g2:#21824c;--bg:#edf3ef;--txt:#17231b;--muted:#657268;--line:#dfe8e1;--red:#b42318}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 13px}header h1{margin:0;font-size:21px}.wrap{max-width:680px;margin:auto;padding:12px}.card{background:#fff;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #12351d16}h2,h3,p{margin-top:0}.muted,.sub{color:var(--muted);font-size:12px}.choice{display:grid;gap:7px;margin-bottom:14px}.players-choice{grid-template-columns:repeat(3,1fr)}.holes-choice{grid-template-columns:repeat(6,1fr)}button{font:inherit;touch-action:manipulation}.btn{border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800;background:#dfe9e2;color:var(--txt)}.btn.active,.primary{background:var(--g);color:#fff}.primary,.wide{width:100%}.secondary,.danger{width:100%;margin-top:8px}.danger{background:#fff0ef;color:var(--red)}input{display:block;width:100%;margin:8px 0;padding:14px;border:1px solid #bccac0;border-radius:11px;font-size:17px}.headline{display:flex;justify-content:space-between;align-items:center}.headline h2{margin:0}.par{text-align:center}.parrow{display:flex;align-items:center;gap:7px}.parnum{font-size:28px;font-weight:900;min-width:32px}.players{display:grid;gap:7px;padding:9px}.player{text-align:center;min-width:0;background:#f5f8f6;border-radius:14px;padding:10px 3px}.name{height:38px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:850;overflow:hidden}.score{font-size:44px;font-weight:900;margin:7px 0}.step{width:56px;max-width:92%;height:50px;border:0;border-radius:12px;font-size:29px;font-weight:900;background:#e2e9e3}.plus{background:var(--g2);color:#fff}.preview{min-height:18px;margin-top:7px;font-size:12px;font-weight:800}.leader{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}.leader:last-child{border:0}.value{font-weight:900;text-align:right}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.history{overflow-x:auto}.grid{display:grid;font-size:12px;text-align:center;min-width:360px}.cell{padding:7px 3px;border-bottom:1px solid var(--line)}.head{font-weight:850;background:#f3f6f3}.last{border-left:5px solid var(--g);background:#eaf5ed}.lastrow{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding-top:6px;font-size:13px}.winner{text-align:center;font-size:24px;font-weight:900;color:var(--g)}.warning{text-align:center;color:var(--muted);font-size:12px}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;font-size:12px}.rules div{background:#f3f6f3;padding:8px 2px;border-radius:9px}.rules b{display:block;font-size:16px}
</style></head><body><header><h1>⛳ Birkkujahti</h1></header><main class="wrap" id="app"></main><script>
'use strict';const KEY='birkkujahti_final_v1';let game=read(),resetArmed=false,resetTimer=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){}render()}function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function playerCount(n){document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',+x.dataset.p===n));let b=document.getElementById('names');b.dataset.n=n;b.innerHTML=Array.from({length:n},(_,i)=>`<input id="n${i}" maxlength="18" placeholder="Pelaaja ${i+1}">`).join('')}function holeCount(n){document.querySelectorAll('[data-h]').forEach(x=>x.classList.toggle('active',+x.dataset.h===n));document.getElementById('holes').dataset.n=n;document.getElementById('holeTitle').textContent=`Reikiä: ${n}`}
function start(){let pc=+document.getElementById('names').dataset.n,hc=+document.getElementById('holes').dataset.n,names=Array.from({length:pc},(_,i)=>document.getElementById('n'+i).value.trim()||`Pelaaja ${i+1}`);game={hole:1,holeCount:hc,par:4,done:false,players:names.map(name=>({name,points:0,strokes:4,strokeTotal:0})),results:[]};save()}
function pts(s,p){if(s<=p-2)return 5;if(s===p-1)return 3;if(s===p)return 1;return 0}function desc(s,p){if(s<=p-2)return'Eagle tai parempi · 5 p';if(s===p-1)return'Birdie · 3 p';if(s===p)return'Par · 1 p';return'Bogey tai huonompi · 0 p'}function par(d){game.par=Math.max(3,Math.min(6,game.par+d));save()}function stroke(i,d){game.players[i].strokes=Math.max(1,Math.min(20,game.players[i].strokes+d));save()}
function saveHole(){let r={hole:game.hole,par:game.par,strokes:[],points:[]};game.players.forEach(p=>{let x=pts(p.strokes,game.par);r.strokes.push(p.strokes);r.points.push(x);p.points+=x;p.strokeTotal+=p.strokes});game.results.push(r);if(game.hole===game.holeCount)game.done=true;else{game.hole++;game.par=4;game.players.forEach(p=>p.strokes=4)}save()}function undo(){if(!game.results.length)return;let r=game.results.pop();game.players.forEach((p,i)=>{p.points-=r.points[i];p.strokeTotal-=r.strokes[i];p.strokes=r.strokes[i]});game.hole=r.hole;game.par=r.par;game.done=false;save()}
function reset(){if(!resetArmed){resetArmed=true;clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;render()},5000);render();return}clearTimeout(resetTimer);resetArmed=false;try{localStorage.removeItem(KEY)}catch(e){}game=null;render();scrollTo(0,0)}
function pointRank(){return game.players.map((p,i)=>({...p,i})).sort((a,b)=>b.points-a.points||a.i-b.i)}function strokeRank(){return game.players.map((p,i)=>({...p,i})).sort((a,b)=>a.strokeTotal-b.strokeTotal||a.i-b.i)}
function standings(title,list,type){return `<section class="card"><h3>${title}</h3>${list.map((p,i)=>`<div class="leader"><b>${i+1}.</b><span>${e(p.name)}<div class="sub">${game.results.length} reikää pelattu</div></span><span class="value">${type==='p'?p.points+' p':p.strokeTotal+' lyöntiä'}</span></div>`).join('')}</section>`}
function history(){if(!game.results.length)return'';let cols=`52px 44px repeat(${game.players.length},minmax(88px,1fr))`;return `<section class="card history"><h3>Reikäkohtaiset tulokset</h3><div class="grid" style="grid-template-columns:${cols}"><div class="cell head">Reikä</div><div class="cell head">Par</div>${game.players.map(p=>`<div class="cell head">${e(p.name)}</div>`).join('')}${game.results.map(r=>`<div class="cell">${r.hole}</div><div class="cell">${r.par}</div>${r.strokes.map((s,i)=>`<div class="cell"><b>${s} lyöntiä</b><div class="sub">${r.points[i]} pistettä</div></div>`).join('')}`).join('')}</div></section>`}
function render(){let a=document.getElementById('app');if(!game){a.innerHTML=`<section class="card"><h2>Uusi Birkkujahti</h2><h3>Pelaajia</h3><div class="choice players-choice"><button class="btn" data-p="2" onclick="playerCount(2)">2</button><button class="btn active" data-p="3" onclick="playerCount(3)">3</button><button class="btn" data-p="4" onclick="playerCount(4)">4</button></div><h3 id="holeTitle">Reikiä: 18</h3><div class="choice holes-choice" id="holes" data-n="18">${Array.from({length:18},(_,i)=>`<button class="btn ${i===17?'active':''}" data-h="${i+1}" onclick="holeCount(${i+1})">${i+1}</button>`).join('')}</div><div id="names" data-n="3"></div><button class="btn primary" onclick="start()">Aloita peli</button><p class="warning">Tulokset tallentuvat paikallisesti kesken kierroksen.</p></section><section class="card"><div class="rules"><div>Par<b>1 p</b></div><div>Birdie<b>3 p</b></div><div>Eagle+<b>5 p</b></div><div>Bogey+<b>0 p</b></div></div></section>`;playerCount(3);return}let pr=pointRank(),sr=strokeRank();if(game.done){let bp=pr[0].points,bs=sr[0].strokeTotal,pw=pr.filter(x=>x.points===bp).map(x=>e(x.name)).join(' & '),sw=sr.filter(x=>x.strokeTotal===bs).map(x=>e(x.name)).join(' & ');a.innerHTML=`<section class="card"><h2 style="text-align:center">Peli päättynyt</h2><div class="winner">Birkkujahti: ${pw}</div><div class="winner">Lyöntipeli: ${sw}</div></section>${standings('Birkkujahdin lopputulos',pr,'p')}${standings('Lyöntipelin lopputulos',sr,'s')}${history()}<button class="btn secondary" onclick="undo()">Korjaa viimeinen reikä</button><button class="btn danger" onclick="reset()">${resetArmed?'Vahvista nollaus':'Nollaa ja aloita uusi peli'}</button><p class="warning">Jos nollaus ei toimi iPhonen esikatselussa, poista selaimen välimuisti tai sivuston tiedot ja avaa tiedosto uudelleen.</p>`;return}let last=game.results.at(-1),cols=`repeat(${game.players.length},minmax(0,1fr))`;a.innerHTML=`<section class="card"><div class="headline"><h2>Reikä ${game.hole} / ${game.holeCount}</h2><div class="par"><div class="sub">Reiän par</div><div class="parrow"><button class="step" onclick="par(-1)">−</button><b class="parnum">${game.par}</b><button class="step plus" onclick="par(1)">+</button></div></div></div></section><section class="card players" style="grid-template-columns:${cols}">${game.players.map((p,i)=>`<div class="player"><div class="name">${e(p.name)}</div><button class="step" onclick="stroke(${i},-1)">−</button><div class="score">${p.strokes}</div><button class="step plus" onclick="stroke(${i},1)">+</button><div class="preview">${desc(p.strokes,game.par)}</div></div>`).join('')}</section><button class="btn primary" onclick="saveHole()">${game.hole===game.holeCount?'Päätä peli':'Tallenna reikä'}</button>${game.results.length?'<button class="btn secondary" onclick="undo()">Peru edellinen reikä</button>':''}${standings('Birkkujahdin pistetilanne',pr,'p')}${standings('Lyöntipelitilanne',sr,'s')}${last?`<section class="card last"><b>Reikä ${last.hole}, par ${last.par}</b>${game.players.map((p,i)=>`<div class="lastrow"><span>${e(p.name)}</span><span>${last.strokes[i]} lyöntiä</span><b>${last.points[i]} p</b></div>`).join('')}</section>`:''}${history()}<button class="btn danger" onclick="reset()">${resetArmed?'Vahvista nollaus':'Nollaa koko peli'}</button><p class="warning">Jos nollaus ei toimi iPhonen esikatselussa, poista selaimen välimuisti tai sivuston tiedot ja avaa tiedosto uudelleen.</p>`}
render();
</script></body></html>
