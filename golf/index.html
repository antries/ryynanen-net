<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf-pelejä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a211a; --panel:#10332a; --line:#2a5a49; --fairway:#3aa266; --mist:#cfe5dc;
  --flag:#ff6b3d; --white:#f5faf7;
  --serif:"Fraunces",Georgia,serif; --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--night);color:var(--white);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:0 1.25rem calc(env(safe-area-inset-bottom,0px) + 3rem)}
.wrap{max-width:52rem;margin:0 auto}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
  padding:calc(env(safe-area-inset-top,0px) + 3.5rem) 0 1.75rem}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(3rem,13vw,6.5rem);line-height:.95;letter-spacing:-.02em}
.pin{flex:none;width:clamp(3.5rem,12vw,6.5rem);height:auto}
.flag{transform-origin:0 0;animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-6deg) scaleX(.92)}}
.strip{height:10px;border-radius:99px;margin-bottom:2rem;
  background:repeating-linear-gradient(90deg,#3aa266 0 3rem,#2f8a55 3rem 6rem)}

/* Tuloskortti */
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.5rem;overflow:hidden}
.row{--accent:var(--flag);display:grid;grid-template-columns:3rem 1fr auto;align-items:center;gap:1rem;
  padding:1.25rem 1.4rem;color:var(--white);text-decoration:none;position:relative;
  border-top:1px solid var(--line);transition:background .15s}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .15s}
.row:hover,.row:focus-visible{background:#164236;outline:none}
.row:hover::before,.row:focus-visible::before{width:6px}
.icon{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.icon svg{width:1.7rem;height:1.7rem}
.txt h2{font-family:var(--serif);font-weight:700;font-size:1.45rem;line-height:1.15}
.arrow{width:1.5rem;height:1.5rem;color:var(--accent);transition:transform .15s}
.row:hover .arrow{transform:translateX(4px)}
.empty{padding:2rem 1.5rem;color:var(--mist)}

@media (max-width:34rem){
  .row{grid-template-columns:1fr auto;gap:.8rem;padding:1.15rem 1rem 1.15rem 1.2rem}
  .icon{display:none}
    .pin{display:none}
}
@media (prefers-reduced-motion:reduce){.flag{animation:none}.row::before,.arrow{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Golf-pelejä</h1>
    <svg class="pin" viewBox="0 0 80 130" aria-hidden="true">
      <ellipse cx="22" cy="122" rx="20" ry="6" fill="#3aa266"/>
      <line x1="22" y1="122" x2="22" y2="8" stroke="#f5faf7" stroke-width="3" stroke-linecap="round"/>
      <g class="flag"><path d="M24 8 L74 24 L24 40Z" fill="#ff6b3d"/></g>
    </svg>
  </header>
  <div class="strip" aria-hidden="true"></div>
  <main class="card" id="apps"><p class="empty">Ladataan…</p></main>
</div>

<script>
/* Lista luetaan tiedostosta apps.json, jonka generate-apps.js luo kansion
   html-tiedostoista joka deployssa. Varalla yritetään kansion automaattilistausta.
   OVERRIDES on valinnainen: tähän voi kirjoittaa oman otsikon ja kuvakkeen
   tiedostonimen mukaan. Muuten otsikko tehdään tiedostonimestä. */
const OVERRIDES = {
  "nassau.html":            { title:"Nassau Live",       icon:"trophy" },
  "birkkujahti.html":       { title:"Birkkujahti",       icon:"bird" },
  "bingo-bango-bongo.html": { title:"Bingo Bango Bongo", icon:"target" }
};
const SKIP = ["index.html", "404.html"];

const ICONS = {
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/>',
  bird:'<path d="M3 14c3-6 8-8 13-6l5-2-2 4c0 6-5 10-11 10-2 0-4-1-5-3"/><circle cx="15.5" cy="9.5" r=".6" fill="currentColor"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
  flag:'<path d="M6 21V4M6 4l12 4-12 5"/>',
  ball:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="13" cy="8.5" r=".8" fill="currentColor"/><circle cx="15" cy="12.5" r=".8" fill="currentColor"/><circle cx="10.5" cy="14.5" r=".8" fill="currentColor"/>',
  cards:'<rect x="4" y="5" width="11" height="15" rx="2"/><path d="M9 5l1-1.5a2 2 0 0 1 2.7-.5l6.3 3.6a2 2 0 0 1 .8 2.7L16 19"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.5 0 4.5 1.8 4.5 4.5"/>'
};
const GUESS = [[/nassau|kisa|turnaus|cup/i,"trophy"],[/birkku|birdie|birdi/i,"bird"],[/bingo|piste|score/i,"target"],
               [/tilasto|stat|kausi/i,"chart"],[/tiimi|joukkue|team|scramble/i,"people"],[/kortti|arvonta/i,"cards"]];
const COLORS = ["#ff6b3d","#ecd9a6","#6fd0e0","#a5e36a","#f4a6c8"];
const SVG = 'http://www.w3.org/2000/svg';
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const ICON = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[n] + '</svg>';

const pretty = f => { const t = f.replace(/\.html?$/i,"").replace(/[-_]+/g," "); return t.charAt(0).toUpperCase()+t.slice(1); };
const clean = list => [...new Set(list)]
  .filter(f => /\.html?$/i.test(f) && !SKIP.includes(f.toLowerCase()))
  .sort((a,b) => a.localeCompare(b, "fi", { numeric:true }));

function render(files){
  const el = document.getElementById("apps");
  el.textContent = "";
  if(!files.length){
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = "Ei vielä pelejä. Lisää kansioon html-tiedosto."; el.appendChild(p); return;
  }
  files.forEach((file,i) => {
    const o = OVERRIDES[file] || {};
    const title = o.title || pretty(file);
    const icon = ICONS[o.icon] ? o.icon : ((GUESS.find(g => g[0].test(file+" "+title)) || [])[1] || (i%2 ? "ball" : "flag"));
    const a = document.createElement("a");
    a.className = "row"; a.href = file; a.style.setProperty("--accent", COLORS[i % COLORS.length]);
    const ic = document.createElement("span"); ic.className = "icon"; ic.setAttribute("aria-hidden","true"); ic.innerHTML = ICON(icon);
    const tx = document.createElement("span"); tx.className = "txt";
    const h = document.createElement("h2"); h.textContent = title; tx.appendChild(h);
    a.append(ic, tx); a.insertAdjacentHTML("beforeend", ARROW);
    el.appendChild(a);
  });
}

/* Varasuunnitelma: lue kansion automaattilistaus (toimii vain palvelimilla, joilla se on päällä) */
const fromListing = () => fetch("./", { cache:"no-store" }).then(r => r.text()).then(t => {
  const hrefs = [...new DOMParser().parseFromString(t,"text/html").querySelectorAll("a[href]")]
    .map(a => decodeURIComponent(a.getAttribute("href").split("/").pop()));
  return clean(hrefs);
});

fetch("apps.json", { cache:"no-store" })
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(l => render(clean(l)))
  .catch(() => fromListing().then(l => { if(!l.length) throw 0; render(l); })
    .catch(() => render(clean(Object.keys(OVERRIDES)))));
</script>
</body>
</html>
